[project]
name = "avip-poc-backend"
version = "0.1.0"
description = "AI Vision Inspection Platform - Proof of Concept Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.9.2",
    "aiosqlite==0.20.0",
    "onnxruntime==1.19.2",
    "opencv-python-headless==4.10.0.84",
    "pillow==10.4.0",
    "numpy==1.26.4",
    "reportlab==4.2.2",
    "qrcode[pil]==7.4.2",
    "scikit-image==0.24.0",
    "python-multipart==0.0.9",
    "httpx==0.27.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "ruff==0.6.8",
    "black==24.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
