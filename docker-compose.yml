services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - poc_data:/app/data
    environment:
      - AVIP_ENV=demo
      - AVIP_DATA_DIR=/app/data
      - AVIP_MODELS_DIR=/app/ai_models
      - AVIP_DEMO_DATA_DIR=/app/demo_data
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  poc_data:
